[build-system]
requires = ["setuptools>=64", "versioningit~=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygsm"
description = "Growing string method for reaction paths, transition states and photochemistry"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Cody Aldaz", email = "codyaldaz@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=2.8",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
xtb = ["tblite>=0.3"]
plot = ["matplotlib"]
test = [
    "pytest>=7",
    "pytest-cov",
    "ase>=3.22",
    "tblite>=0.3",
]
dev = [
    "pygsm[ase,xtb,plot,test]",
    "ruff>=0.14",
    "pre-commit",
]

[project.scripts]
gsm = "pygsm.cli:main"

[tool.setuptools]
# Ship type hints (PEP 561); a zipped install would hide them from type checkers.
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pygsm*"]
namespaces = false

[tool.setuptools.package-data]
pygsm = ["py.typed"]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "pygsm/_version.py"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/golden/baselines"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # long lines are handled by the formatter
    "E741",   # single-letter names (i, j, l) are idiomatic in the numerics
    "RUF012", # mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: numerical regression tests against stored baselines (slow; need OMP_NUM_THREADS=1)",
]

[tool.coverage.run]
source = ["pygsm"]
omit = ["pygsm/_version.py"]
